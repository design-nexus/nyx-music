[package]
name = "nyx-music"
version = "0.1.0"
description = "A music player for NyxOS and Omarchy: media library, playlists, internet radio, podcasts, equalizer and a live spectrum analyzer"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-music"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-music"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", default-features = false }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
anyhow = "1.0.104"
async-channel = "2"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lofty = "0.25"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-normalization = "0.1.25"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
zbus = "5"

nyx-sync = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
