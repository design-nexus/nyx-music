[package]
name = "nyx-music"
version = "0.1.0"
description = "A music player for Omarchy: media library, playlists, internet radio, podcasts, equalizer and a live spectrum analyzer"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-music"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-music"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
anyhow = "1.0.104"
async-channel = "2"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lofty = "0.25"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-normalization = "0.1.25"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
zbus = "5"
